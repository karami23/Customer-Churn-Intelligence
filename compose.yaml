services:
  db:
    image: postgres:17
    container_name: churn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: churn_intelligence
      POSTGRES_USER: churn_app
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn_app -d churn_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: